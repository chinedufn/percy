name: tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          # Used when running the browser tests
          target: wasm32-unknown-unknown

      - name: Rust Version Info
        run: rustc --version && cargo --version && echo $CARGO_HOME

      # `Cargo.lock` is not committed, so we install the `wasm-bindgen-cli` version that matches
      # the `wasm-bindgen` version that gets resolved.
      - name: Install wasm-bindgen-cli
        run: |
          cargo generate-lockfile
          WASM_BINDGEN_VERSION=$(cargo pkgid wasm-bindgen | cut -d@ -f2)
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked

      - name: Browser versions
        run: wasm-bindgen-test-runner --version && firefox --version && $GECKOWEBDRIVER/geckodriver --version

      - name: Run all tests
        run: GECKODRIVER=$GECKOWEBDRIVER/geckodriver ./test.sh
